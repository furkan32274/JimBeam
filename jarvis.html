<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #4fc3f7;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #050d1a 0%, #000 100%);
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,150,255,0.03) 40px, rgba(0,150,255,0.03) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,150,255,0.03) 40px, rgba(0,150,255,0.03) 41px);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 16px 0 10px;
      border-bottom: 1px solid rgba(79,195,247,0.2);
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 2rem;
      letter-spacing: 0.5em;
      color: #4fc3f7;
      text-shadow: 0 0 20px #4fc3f7, 0 0 40px rgba(79,195,247,0.5);
      font-weight: 300;
    }

    .header .sub {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: rgba(79,195,247,0.5);
      margin-top: 4px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: rgba(79,195,247,0.4);
      margin-top: 6px;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4fc3f7;
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 4px #4fc3f7; }
      50% { opacity: 0.4; box-shadow: none; }
    }

    .setup-panel {
      background: rgba(0,100,160,0.1);
      border: 1px solid rgba(79,195,247,0.2);
      border-radius: 4px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .setup-panel label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: rgba(79,195,247,0.6);
      white-space: nowrap;
    }

    select, .setup-panel input {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(79,195,247,0.3);
      color: #4fc3f7;
      padding: 5px 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      border-radius: 2px;
      outline: none;
      flex: 1;
      min-width: 160px;
    }

    select:focus, .setup-panel input:focus {
      border-color: #4fc3f7;
      box-shadow: 0 0 8px rgba(79,195,247,0.3);
    }

    select option { background: #050d1a; }

    .btn-small {
      background: rgba(79,195,247,0.1);
      border: 1px solid rgba(79,195,247,0.4);
      color: #4fc3f7;
      padding: 5px 12px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      border-radius: 2px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-small:hover { background: rgba(79,195,247,0.25); box-shadow: 0 0 10px rgba(79,195,247,0.3); }

    .btn-small.active {
      background: rgba(79,195,247,0.3);
      box-shadow: 0 0 12px rgba(79,195,247,0.5);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: rgba(79,195,247,0.3) transparent;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: rgba(79,195,247,0.3); border-radius: 2px; }

    .message {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(79,195,247,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      color: rgba(79,195,247,0.7);
    }

    .avatar.jarvis-avatar {
      background: radial-gradient(circle, rgba(0,150,255,0.2) 0%, transparent 70%);
      box-shadow: 0 0 10px rgba(79,195,247,0.3);
      animation: pulse 3s infinite;
    }

    .avatar.user-avatar {
      background: rgba(200,50,50,0.15);
      border-color: rgba(200,80,80,0.4);
      color: rgba(200,100,100,0.8);
    }

    .bubble {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 2px;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .jarvis .bubble {
      background: rgba(0,100,180,0.12);
      border: 1px solid rgba(79,195,247,0.2);
      border-left: 2px solid rgba(79,195,247,0.6);
      color: #b3e5fc;
    }

    .user .bubble {
      background: rgba(180,30,30,0.12);
      border: 1px solid rgba(200,80,80,0.2);
      border-right: 2px solid rgba(200,80,80,0.5);
      color: #ffcdd2;
      text-align: right;
    }

    .bubble .sender {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      margin-bottom: 4px;
      opacity: 0.5;
    }

    .typing-dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #4fc3f7;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    .input-area {
      border-top: 1px solid rgba(79,195,247,0.15);
      padding-top: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(79,195,247,0.25);
      border-radius: 2px;
      color: #e0f7fa;
      padding: 10px 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      resize: none;
      outline: none;
      max-height: 100px;
      line-height: 1.5;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #input:focus {
      border-color: rgba(79,195,247,0.6);
      box-shadow: 0 0 12px rgba(79,195,247,0.15);
    }

    #input::placeholder { color: rgba(79,195,247,0.2); }

    #micBtn {
      background: rgba(79,195,247,0.1);
      border: 1px solid rgba(79,195,247,0.4);
      color: #4fc3f7;
      width: 42px; height: 42px;
      cursor: pointer;
      font-size: 1.1rem;
      border-radius: 50%;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    #micBtn:hover { background: rgba(79,195,247,0.25); box-shadow: 0 0 15px rgba(79,195,247,0.4); }

    #micBtn.listening {
      background: rgba(255,50,50,0.2);
      border-color: rgba(255,80,80,0.7);
      color: #ff6b6b;
      box-shadow: 0 0 20px rgba(255,80,80,0.5);
      animation: micPulse 1s infinite;
    }

    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(255,80,80,0.4); }
      50% { box-shadow: 0 0 25px rgba(255,80,80,0.8); }
    }

    #sendBtn {
      background: rgba(79,195,247,0.1);
      border: 1px solid rgba(79,195,247,0.4);
      color: #4fc3f7;
      padding: 10px 20px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      border-radius: 2px;
      transition: all 0.2s;
      height: 42px;
    }

    #sendBtn:hover:not(:disabled) { background: rgba(79,195,247,0.25); box-shadow: 0 0 15px rgba(79,195,247,0.4); }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Voice wave animation shown when Jarvis is speaking */
    #voiceWave {
      display: none;
      align-items: center;
      gap: 3px;
      padding: 4px 8px;
      background: rgba(79,195,247,0.08);
      border: 1px solid rgba(79,195,247,0.2);
      border-radius: 20px;
      margin-bottom: 6px;
    }

    #voiceWave.active { display: flex; }
    #voiceWave span {
      display: inline-block;
      width: 3px;
      background: #4fc3f7;
      border-radius: 2px;
      animation: wave 1s ease-in-out infinite;
    }
    #voiceWave span:nth-child(1) { height: 8px; animation-delay: 0s; }
    #voiceWave span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
    #voiceWave span:nth-child(3) { height: 20px; animation-delay: 0.2s; }
    #voiceWave span:nth-child(4) { height: 14px; animation-delay: 0.3s; }
    #voiceWave span:nth-child(5) { height: 8px; animation-delay: 0.4s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    #voiceWave .wave-label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: rgba(79,195,247,0.6);
      margin-left: 6px;
    }

    .corner {
      position: fixed;
      width: 40px; height: 40px;
      opacity: 0.3;
    }
    .corner.tl { top: 10px; left: 10px; border-top: 1px solid #4fc3f7; border-left: 1px solid #4fc3f7; }
    .corner.tr { top: 10px; right: 10px; border-top: 1px solid #4fc3f7; border-right: 1px solid #4fc3f7; }
    .corner.bl { bottom: 10px; left: 10px; border-bottom: 1px solid #4fc3f7; border-left: 1px solid #4fc3f7; }
    .corner.br { bottom: 10px; right: 10px; border-bottom: 1px solid #4fc3f7; border-right: 1px solid #4fc3f7; }
  </style>
</head>
<body>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div id="app">
  <div class="header">
    <h1>J.A.R.V.I.S.</h1>
    <div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
    <div class="status-bar">
      <span><span class="status-dot"></span>SYSTEM ONLINE</span>
      <span id="clock"></span>
      <span>STARK INDUSTRIES v3.1</span>
    </div>
  </div>

  <div class="setup-panel">
    <label>PROVIDER</label>
    <select id="provider">
      <option value="openai">OpenAI (ChatGPT)</option>
      <option value="anthropic">Anthropic (Claude)</option>
    </select>
    <label>API KEY</label>
    <input type="password" id="apiKey" placeholder="sk-..." />
    <button class="btn-small" onclick="saveKey()">SAVE</button>
    <button class="btn-small" id="voiceToggle" onclick="toggleVoiceOutput()">🔊 VOICE ON</button>
    <button class="btn-small" onclick="clearChat()">CLEAR</button>
  </div>

  <div id="chat"></div>

  <div id="voiceWave">
    <span></span><span></span><span></span><span></span><span></span>
    <span class="wave-label">JARVIS SPEAKING…</span>
  </div>

  <div class="input-area">
    <textarea id="input" rows="1" placeholder="Speak your mind, Sir… or press 🎤"></textarea>
    <button id="micBtn" onclick="toggleMic()" title="Spracheingabe">🎤</button>
    <button id="sendBtn" onclick="sendMessage()">SEND ▶</button>
  </div>
</div>

<script>
  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Persisted settings
  const savedKey = localStorage.getItem('jarvis_api_key');
  const savedProvider = localStorage.getItem('jarvis_provider');
  if (savedKey) document.getElementById('apiKey').value = savedKey;
  if (savedProvider) document.getElementById('provider').value = savedProvider;

  let voiceOutputEnabled = localStorage.getItem('jarvis_voice') !== 'off';
  updateVoiceToggleBtn();

  function saveKey() {
    localStorage.setItem('jarvis_api_key', document.getElementById('apiKey').value);
    localStorage.setItem('jarvis_provider', document.getElementById('provider').value);
    addMessage('jarvis', 'Settings saved, Sir. I am fully operational.');
  }

  function toggleVoiceOutput() {
    voiceOutputEnabled = !voiceOutputEnabled;
    localStorage.setItem('jarvis_voice', voiceOutputEnabled ? 'on' : 'off');
    updateVoiceToggleBtn();
    if (!voiceOutputEnabled) window.speechSynthesis.cancel();
  }

  function updateVoiceToggleBtn() {
    const btn = document.getElementById('voiceToggle');
    btn.textContent = voiceOutputEnabled ? '🔊 VOICE ON' : '🔇 VOICE OFF';
    btn.classList.toggle('active', voiceOutputEnabled);
  }

  // ── Speech Recognition (Mikrofon) ──────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'de-DE';

    recognition.onresult = (e) => {
      const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
      document.getElementById('input').value = transcript;
      if (e.results[e.results.length - 1].isFinal) {
        stopListening();
        sendMessage();
      }
    };

    recognition.onerror = () => stopListening();
    recognition.onend = () => stopListening();
  }

  function toggleMic() {
    if (!recognition) {
      addMessage('jarvis', "I'm afraid your browser does not support speech recognition, Sir. Try Chrome or Safari.");
      return;
    }
    if (isListening) {
      stopListening();
    } else {
      startListening();
    }
  }

  function startListening() {
    window.speechSynthesis.cancel();
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
    document.getElementById('micBtn').textContent = '⏹';
    recognition.start();
  }

  function stopListening() {
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
    document.getElementById('micBtn').textContent = '🎤';
    try { recognition.stop(); } catch(_) {}
  }

  // ── Speech Synthesis (Jarvis spricht) ──────────────
  function speak(text) {
    if (!voiceOutputEnabled) return;
    window.speechSynthesis.cancel();

    const clean = text.replace(/[*_`#]/g, '');
    const utter = new SpeechSynthesisUtterance(clean);

    // Pick best available voice
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v =>
      v.name.includes('Daniel') ||   // macOS English
      v.name.includes('Alex') ||
      v.name.includes('Google UK') ||
      (v.lang.startsWith('en') && !v.name.includes('Female'))
    ) || voices.find(v => v.lang.startsWith('en')) || voices[0];

    if (preferred) utter.voice = preferred;
    utter.rate = 0.95;
    utter.pitch = 0.85;
    utter.volume = 1;

    const wave = document.getElementById('voiceWave');
    utter.onstart = () => wave.classList.add('active');
    utter.onend = () => wave.classList.remove('active');
    utter.onerror = () => wave.classList.remove('active');

    window.speechSynthesis.speak(utter);
  }

  // Voices load async on some browsers
  window.speechSynthesis.onvoiceschanged = () => {};

  // ── Chat ─────────────────────────────────────────
  let history = [];

  const SYSTEM_PROMPT = `You are J.A.R.V.I.S. (Just A Rather Very Intelligent System), Tony Stark's personal AI assistant.
Your personality:
- Address the user as "Sir" naturally and occasionally
- Be witty, intelligent, and slightly dry in humor — like in the Iron Man movies
- Give concise, sharp, useful answers
- Occasionally make subtle Iron Man / Stark Industries references
- Never break character
- Respond in the same language the user writes in (German or English)
- Keep responses brief and punchy unless detail is needed`;

  function addMessage(role, text) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `message ${role === 'user' ? 'user' : 'jarvis'}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role === 'user' ? 'user-avatar' : 'jarvis-avatar'}`;
    avatar.textContent = role === 'user' ? 'SIR' : 'JAR';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const sender = document.createElement('div');
    sender.className = 'sender';
    sender.textContent = role === 'user' ? 'YOU' : 'J.A.R.V.I.S.';

    const content = document.createElement('div');
    content.textContent = text;

    bubble.appendChild(sender);
    bubble.appendChild(content);
    div.appendChild(avatar);
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'message jarvis';
    div.id = 'typing';
    const avatar = document.createElement('div');
    avatar.className = 'avatar jarvis-avatar';
    avatar.textContent = 'JAR';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="sender">J.A.R.V.I.S.</div><div class="typing-dots"><span></span><span></span><span></span></div>';
    div.appendChild(avatar);
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function clearChat() {
    document.getElementById('chat').innerHTML = '';
    history = [];
    window.speechSynthesis.cancel();
    addMessage('jarvis', 'Memory cleared, Sir. Starting fresh.');
  }

  async function sendMessage() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    const apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('jarvis_api_key');
    if (!apiKey) {
      addMessage('jarvis', 'Sir, I require an API key to function. Please enter one above and click SAVE.');
      return;
    }

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    addTyping();

    try {
      const provider = document.getElementById('provider').value;
      const reply = provider === 'openai'
        ? await callOpenAI(apiKey, history)
        : await callAnthropic(apiKey, history);

      removeTyping();
      addMessage('jarvis', reply);
      history.push({ role: 'assistant', content: reply });
      speak(reply);

    } catch (err) {
      removeTyping();
      addMessage('jarvis', `I'm afraid something went wrong, Sir. ${err.message}`);
    }

    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  async function callOpenAI(apiKey, history) {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...history],
        max_tokens: 400,
        temperature: 0.8
      })
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
    return (await res.json()).choices[0].message.content;
  }

  async function callAnthropic(apiKey, history) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 400,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
    return (await res.json()).content[0].text;
  }

  document.getElementById('input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  document.getElementById('input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });

  setTimeout(() => {
    const msg = "Good evening, Sir. All systems are online. Enter your API key and press SAVE — then you may speak to me via the microphone or type below.";
    addMessage('jarvis', msg);
    speak(msg);
  }, 400);
</script>
</body>
</html>
