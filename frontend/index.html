<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis</title>
  </head>
  <body>
    <!-- Three.js renders here -->
    <canvas id="orb-canvas"></canvas>

    <!-- Status text above the label -->
    <div id="status-text"></div>

    <!-- Persistent label at the very bottom -->
    <div id="assistant-label">JARVIS</div>

    <!-- Connection indicator — top-right -->
    <div id="connection-badge">
      <span id="connection-dot"></span>
      <span id="connection-label">connecting</span>
    </div>

    <!-- Mute toggle -->
    <button id="mute-button" type="button" aria-pressed="false" aria-label="Mute microphone">
      mute
    </button>

    <!-- Error / info toast -->
    <div id="error-text"></div>

    <!-- Chat panel -->
    <div id="chat-panel">
      <div id="chat-header">
        <span id="chat-title">JARVIS CHAT</span>
        <button id="chat-close" aria-label="Close chat">✕</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="Schreib Jarvis..." autocomplete="off" />
        <button id="chat-send" aria-label="Send">↑</button>
      </div>
    </div>

    <!-- Chat toggle button -->
    <button id="chat-toggle" aria-label="Open chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
